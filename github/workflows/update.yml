name: RMW Daily Robot
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  add-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Run RMW Bot
        run: node .github/scripts/daily.js
      - name: Save and Push
        run: |
          git config --local user.email "bot@rmw-ai-tools.com"
          git config --local user.name "RMW Robot"
          git add tools.json
          git diff --staged --quiet || git commit -m "🤖 RMW Bot: New AI Tool Added - Daily Money Update"
          git push
