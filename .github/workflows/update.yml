name: RMW Daily Robot
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Run RMW Bot
        run: node .github/scripts/daily.js
      
      - name: Save and Push
        run: |
          git config --local user.email "bot@rmw-ai-tools.com"
          git config --local user.name "RMW Robot"
          git add tools.json
          git diff --staged --quiet || git commit -m "🤖 RMW Bot: New AI Tool Added"
          git push
